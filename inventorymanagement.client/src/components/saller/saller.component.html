<div class="container">
  <div class="row">

    <!-- Toast -->
    <div class="toast-container">
      <ngb-toast *ngIf="showToastFlag" [ngClass]="{'toast-success': toastType === 'success', 'toast-error': toastType === 'error'}"
                 [autohide]="true" [delay]="3000" (hidden)="showToastFlag = false">
        {{ toastMessage }}
      </ngb-toast>
    </div>

    <!-- Form Section -->
    <div class="col-md-4">
      <div class="card rounded shadow">
        <div class="card-body">
          <form (ngSubmit)="saveSaller()" #sallerForm="ngForm">
            <div class="form-group">
              <label for="name">Seller Name</label>
              <input type="text" class="form-control" id="name" required [(ngModel)]="newSaller.name" name="name">
            </div>
            <div class="form-group">
              <label for="cnic">CNIC</label>
              <input type="text" class="form-control" id="cnic" required [(ngModel)]="newSaller.cnic" name="cnic">
            </div>
            <div class="form-group">
              <label for="phoneNumber">Phone Number</label>
              <input type="text" class="form-control" id="phoneNumber" required [(ngModel)]="newSaller.phoneNumber" name="phoneNumber">
            </div>
            <div class="form-group">
              <label for="address">Address</label>
              <input type="text" class="form-control" id="address" required [(ngModel)]="newSaller.address" name="address">
            </div>
            <div class="form-group">
              <label for="documents">Upload Documents</label>
              <input type="file" class="form-control" id="documents" (change)="onDocumentSelected($event)" multiple>
            </div>
            <button type="submit" class="btn btn-primary" [disabled]="!sallerForm.form.valid">Create Seller</button>
          </form>
        </div>
      </div>
    </div>

    <!-- Loading Spinner -->
    <div *ngIf="isLoading" class="d-flex justify-content-center my-3">
      <div class="spinner-grow text-primary" role="status"></div>
    </div>

    <!-- Table Section -->
    <div class="col-md-8">
      <h6 *ngIf="sallers.length === 0">
        <span class="custom-badge">No Seller Found!</span>
      </h6>
      <div *ngIf="sallers.length > 0" class="card rounded shadow">
        <div class="card-body">
          <table class="table custom-style">
            <thead>
              <tr>
                <th>Name</th>
                <th>CNIC</th>
                <th>Phone</th>
                <th>Address</th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody>
              <tr *ngFor="let saller of sallers">
                <td>{{ saller.name }}</td>
                <td>{{ saller.cnic }}</td>
                <td>{{ saller.phoneNumber }}</td>
                <td>{{ saller.address }}</td>
                <td>
                  <div class="btn-group" role="group" aria-label="Seller Actions">
                    <button class="btn btn-primary btn-sm rounded mx-1" (click)="openUpdateModal(saller)">Edit</button>
                    <!-- Optional: Document View Button -->
                  </div>
                </td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>

    <!-- Update Modal -->
    <ng-template #updateModal let-modal>
      <div class="modal-header">
        <h4 class="modal-title">Update Seller</h4>
      </div>
      <div class="modal-body">
        <form (ngSubmit)="updateSaller(modal)" #updateForm="ngForm">
          <div class="form-group">
            <label for="name">Seller Name</label>
            <input type="text" class="form-control" id="name" required [(ngModel)]="selectedSaller.name" name="name">
          </div>
          <div class="form-group">
            <label for="cnic">CNIC</label>
            <input type="text" class="form-control" id="cnic" required [(ngModel)]="selectedSaller.cnic" name="cnic">
          </div>
          <div class="form-group">
            <label for="phoneNumber">Phone Number</label>
            <input type="text" class="form-control" id="phoneNumber" required [(ngModel)]="selectedSaller.phoneNumber" name="phoneNumber">
          </div>
          <div class="form-group">
            <label for="address">Address</label>
            <input type="text" class="form-control" id="address" required [(ngModel)]="selectedSaller.address" name="address">
          </div>
          <div class="form-group">
            <label for="updateDocuments">Replace Documents</label>
            <input type="file" class="form-control" id="updateDocuments" (change)="onUpdateDocumentSelected($event)" multiple>
          </div>
          <div class="d-flex justify-content-between">
            <button type="submit" class="btn btn-primary" [disabled]="!updateForm.form.valid">Update Seller</button>
            <button type="button" class="btn btn-secondary" (click)="modal.dismiss('Close click')">Close</button>
          </div>
        </form>
      </div>
    </ng-template>

  </div>
</div>
